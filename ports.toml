# Port registry. Tiers are derived; never set them by hand (see CONTRIBUTING.md).

[[port]]
id = "json"
name = "JSON palette"
category = "data"
phase = 1
output_root = "ports/json"
docs = "internal"
format_confirmed = true
target_version = "schema 1"
install = "Read ports/json/umber-calm.json from your tooling."
uninstall = "Stop reading the file."
checklist = ["parses as JSON", "contains every metadata key, color, ANSI slot, role and tint"]
syntax_exempt = "exports the syntax roles as data; the palette loader already rejects red and orange in [roles.syntax]"

[[port]]
id = "wezterm"
name = "WezTerm"
category = "terminal"
phase = 1
output_root = "ports/wezterm"
docs = "https://wezterm.org/config/appearance.html"
format_confirmed = true
target_version = "20240203"
install = "Copy umber-calm.toml to ~/.config/wezterm/colors/ and set `config.color_scheme = 'Umber Calm'` in wezterm.lua."
uninstall = "Remove the color_scheme line and the file."
checklist = ["background and text", "16 ANSI colors (run a color test script)", "selection", "cursor and cursor text", "tab bar: active tab amber, inactive muted"]

[[port]]
id = "tmux"
name = "tmux"
category = "multiplexer"
phase = 1
output_root = "ports/tmux"
docs = "https://github.com/tmux/tmux/wiki"
format_confirmed = true
target_version = "3.4"
install = "Copy umber-calm.tmux to ~/.config/tmux/ and add `source-file ~/.config/tmux/umber-calm.tmux` to tmux.conf, then `tmux source-file ~/.config/tmux/tmux.conf`."
uninstall = "Remove the source-file line and the file."
checklist = ["status bar", "current window amber", "pane borders (active amber)", "copy-mode selection and search matches", "messages"]

[[port]]
id = "zellij"
name = "Zellij"
category = "multiplexer"
phase = 1
output_root = "ports/zellij"
docs = "https://zellij.dev/documentation/themes.html"
format_confirmed = true
target_version = "0.45.1"
install = "Uses Zellij's component theme format (written for Zellij 0.45.1; older releases that only read the legacy 11-color palette are not supported). Copy umber-calm.kdl to ~/.config/zellij/themes/ and set `theme \"umber-calm\"` in config.kdl."
uninstall = "Remove the theme line and the file."
checklist = ["status bar and tab bar: active tab and current mode are orange (focus), inactive ones neutral", "focused pane frame is orange; other pane frames are muted", "focused frame stays orange in other modes (resize, scroll, locked)", "session manager and plugin lists/tables readable", "search highlights"]

[[port]]
id = "herdr"
name = "herdr"
category = "multiplexer"
phase = 2
output_root = "ports/herdr"
docs = "https://herdr.dev/docs/configuration/"
format_confirmed = true
target_version = "0.9.1"
install = "herdr has no includes: paste the contents of umber-calm.toml into ~/.config/herdr/config.toml, replacing any [theme] and [theme.custom] tables, then run `herdr server reload-config`."
uninstall = "Remove the pasted [theme] and [theme.custom] tables and reload the config."
risk = "herdr has one red token: it marks blocked agents and needs-attention notices as well as delete confirmations."
checklist = ["panes on bg, sidebar a step lighter", "focused pane border and active popup are orange (focus); nothing else is", "active space and agent row readable, navigate cursor row distinct from it", "agent states: working yellow, done green, blocked red, unseen blue or cyan", "secondary labels (workspace numbers, headers, inactive tabs) readable", "worktree and settings overlays readable"]

[[port]]
id = "starship"
name = "Starship"
category = "shell"
phase = 1
output_root = "ports/starship"
docs = "https://starship.rs/advanced-config/"
format_confirmed = true
target_version = "1.20"
install = "Copy the [palettes.umber_calm] table into ~/.config/starship.toml and add `palette = \"umber_calm\"` at the top level. Use the palette names (text, muted, blue, …) in your module styles."
uninstall = "Remove the palette line and the table."
checklist = ["prompt segments render in palette colors", "error symbol uses red", "no raw hex in your styles is needed"]

[[port]]
id = "claude-code"
name = "Claude Code"
category = "ai"
phase = 1
output_root = "ports/claude-code"
docs = "https://code.claude.com/docs/en/terminal-config"
format_confirmed = true
target_version = "2.1.284"
install = "Copy umber-calm.json to ~/.claude/themes/ and select it with /theme (custom:umber-calm). It builds on the dark-ansi base, so use it together with an Umber Calm terminal port."
uninstall = "Pick another theme with /theme and delete the file."
checklist = ["message backgrounds", "composerSidebarBackground visibly applied: the diff side panel is the surface color, not gray", "diff +/− counts readable (green/red)", "no gray bands on added rows"]

[[port]]
id = "vscode"
name = "VS Code"
category = "editor"
phase = 1
output_root = "ports/vscode"
docs = "https://code.visualstudio.com/api/extension-guides/color-theme"
format_confirmed = true
target_version = "1.95"
min_version = "1.95.0"
install = "Download umber-calm-<version>.vsix from the latest release and run `code --install-extension umber-calm-<version>.vsix`, then pick Umber Calm with Cmd/Ctrl+K Cmd/Ctrl+T."
uninstall = "Uninstall the Umber Calm extension from the Extensions view."
checklist = ["editor background, text, current line", "syntax: keywords gold, functions teal-slate, types sea-green, strings olive, constants mauve, operators tan, comments muted", "selection, word highlights and find matches (current match solid gold with dark text)", "cursor amber", "tabs: active tab has an amber top border", "sidebar, status bar, panel", "diff editor", "integrated terminal ANSI colors"]
syntax_check = { file = "themes/umber-calm-color-theme.json", format = "vscode" }

[[port]]
id = "neovim"
name = "Neovim"
category = "editor"
phase = 1
output_root = "."
docs = "https://neovim.io/doc/user/syntax.html#highlight-groups"
format_confirmed = true
target_version = "0.10"
inputs = ["lua/umber-calm/**/*.lua", "lua/lualine/themes/umber-calm.lua", "colors/umber-calm.lua", "colors/umber-calm.vim", "doc/umber-calm.txt"]
syntax_exempt = "roles resolve at runtime; tests/nvim/run.lua checks that every emitted syntax group exists and is never red or orange"
install = "lazy.nvim: `{ \"ChristianOrrala/umber-calm\", lazy = false, priority = 1000, config = function() vim.cmd.colorscheme(\"umber-calm\") end }`. Optional: `require(\"umber-calm\").setup({ ... })` before the colorscheme call (see :help umber-calm)."
uninstall = "Remove the plugin spec and choose another colorscheme."
checklist = ["Normal, CursorLine, Visual (text stays readable), Search/CurSearch", "Treesitter: keywords gold, functions teal-slate, types sea-green, strings olive, constants mauve, operators tan, comments muted italic", "diagnostics with tinted virtual text", "telescope, gitsigns, which-key, blink.cmp/nvim-cmp, lazy UI, indent-blankline", "lualine theme: the mode segment is orange (focus) in every mode", ":terminal colors", ":help umber-calm opens"]

[[port]]
id = "vim"
name = "Vim"
category = "editor"
phase = 1
output_root = "."
